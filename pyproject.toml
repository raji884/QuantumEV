[project]
name = "quantumev"
version = "0.1.0"
description = "Intelligent EV charging and smart-grid optimization with AI and quantum computing"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
