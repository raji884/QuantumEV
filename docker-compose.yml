name: quantumev

services:
  postgres:
    image: postgres:16-alpine
    container_name: quantumev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantumev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantumev}
      POSTGRES_DB: ${POSTGRES_DB:-quantumev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantumev} -d ${POSTGRES_DB:-quantumev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quantumev-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Inside the compose network Postgres is reachable by service name.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quantumev}:${POSTGRES_PASSWORD:-quantumev}@postgres:5432/${POSTGRES_DB:-quantumev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me}
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-5}
      SIM_EV_COUNT: ${SIM_EV_COUNT:-100}
      SIM_STATION_COUNT: ${SIM_STATION_COUNT:-10}
      SIM_ZONE_COUNT: ${SIM_ZONE_COUNT:-3}
      SIM_RANDOM_SEED: ${SIM_RANDOM_SEED:-42}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
    container_name: quantumev-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
